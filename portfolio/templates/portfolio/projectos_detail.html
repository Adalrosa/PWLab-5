{% extends 'portfolio/base.html' %}

{% block content %}
    <h1>{{ projecto.titulo }}</h1>
    <p>{{ projecto.descricao }}</p>
    
    {% if projecto.imagem %}
        <img src="{{ projecto.imagem.url }}" width="300" alt="{{ projecto.titulo }}">
    {% endif %}
    
    <br><br>
    <a href="{% url 'portfolio:projectos' %}">Voltar aos projetos</a>
{% endblock content %}
